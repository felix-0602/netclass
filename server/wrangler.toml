name = "netclass-sidekick"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Worker 运行时变量（非敏感）
[vars]
PROTOCOL_VERSION = "1.0.0-alpha"

# D1 绑定（SQLite 托管）
[[d1_databases]]
binding = "DB"
database_name = "netclass-db"
database_id = "PLACEHOLDER_RUN_wrangler_d1_create_AFTER_LOGIN"
migrations_dir = "src/db/migrations"

# R2 绑定（对象存储：合成图 + OTA 脚本）
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "netclass-storage"

# 敏感配置走 wrangler secret put，不 commit：
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_KEY

# Dev 本地开发用
[dev]
port = 8787
local_protocol = "http"
